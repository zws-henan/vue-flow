# 工作流名称：部署到 GitHub Pages（gh-pages 分支方式）
name: Deploy to GitHub Pages

# 触发条件：当 main 分支有代码推送（PR 合并）时触发
on:
  push:
    branches:
      - main

# 权限控制：需要写入仓库代码权限（用于推送 gh-pages 分支）
permissions:
  contents: write

jobs:
  # 任务：构建并部署到 gh-pages 分支
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤 2：配置 Node.js 环境，启用 npm 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 步骤 3：安装项目依赖
      - name: Install dependencies
        run: npm install

      # 步骤 4：运行 Lint 代码检查（合并到 main 前再校验一次）
      - name: Run Lint
        run: npm run lint

      # 步骤 5：运行单元测试（合并到 main 前再校验一次）
      - name: Run Tests
        run: npm run test

      # 步骤 6：构建项目（vite build）
      - name: Build project
        run: npm run build

      # 步骤 7：部署构建产物到 gh-pages 分支
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
